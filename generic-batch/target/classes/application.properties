spring.application.name=generic-batch

#Database connection
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//10.110.0.8:1539/xepdb1
spring.datasource.username=DIP_DEV
spring.datasource.password=DIP_DEV
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Force Spring Batch to create its metadata tables
spring.batch.jdbc.initialize-schema=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults: false

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


generic.batch.job-name=personBasicInfo
person-basic-info-api-host=http://localhost:9093
spring.cloud.openfeign.client.config.NIC.url=${person-basic-info-api-host}
generic-batch.scheduler-cron=${GENERIC_BATCH_SCHEDULER_CRON:0 */10 * * * *}
generic-batch-restart.scheduler-cron = 0 */1 * * * *
#logging.level.org.springframework=TRACE
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
