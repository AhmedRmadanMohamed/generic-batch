apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ${project.artifactId}
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/auth-url: "http://auth-svc.namaa.svc.cluster.local:8080/auth-svc/api/v1/auth/?url=$request_uri&method=$request_method"
    nginx.ingress.kubernetes.io/auth-response-headers: "USER_INFO"
spec:
  rules:
    - host: ${host}
      http:
        paths:
          - path: /${project.artifactId}/
            pathType: Prefix
            backend:
              serviceName: ${project.artifactId}
              servicePort: 8080
